<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>অ্যাডমিন ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .dashboard { display: flex; flex-wrap: wrap; gap: 20px; }
        .map-container { flex: 2; min-width: 300px; height: 500px; background: #1e293b; border-radius: 15px; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        .info-panel { flex: 1; min-width: 250px; background: #1e293b; border-radius: 15px; padding: 20px; height: 500px; overflow-y: auto; }
        .info-panel h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .device-card { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #38bdf8; }
        .device-card .name { font-weight: bold; font-size: 16px; }
        .device-card .detail { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .online { border-left-color: #22c55e; }
        .no-data { text-align: center; color: #64748b; margin-top: 50px; }
    </style>
</head>
<body>
    <h1>📡 লাইভ মনিটরিং ড্যাশবোর্ড</h1>
    <div class="dashboard">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="info-panel">
            <h2>📱 কানেক্টেড ডিভাইস</h2>
            <div id="deviceList">
                <div class="no-data">কোনো ডিভাইস কানেক্ট হয়নি।<br>টার্গেট লিংকটি খুলে সম্মতি দিন।</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([23.8103, 90.4125], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        
        let markers = {};
        let circles = {}; // নির্ভুলতার বৃত্ত রাখার জন্য

        function fetchClients() {
            fetch('/api/clients')
                .then(res => res.json())
                .then(clients => {
                    const list = document.getElementById('deviceList');
                    list.innerHTML = '';
                    const clientIds = Object.keys(clients);

                    if (clientIds.length === 0) {
                        list.innerHTML = '<div class="no-data">কোনো ডিভাইস কানেক্ট হয়নি।</div>';
                        Object.keys(markers).forEach(id => {
                            map.removeLayer(markers[id]);
                            if(circles[id]) map.removeLayer(circles[id]);
                            delete markers[id];
                            delete circles[id];
                        });
                        return;
                    }

                    clientIds.forEach(id => {
                        const data = clients[id];
                        const card = document.createElement('div');
                        card.className = 'device-card online';
                        card.innerHTML = `
                            <div class="name">🖥️ ${data.os || 'অজানা ডিভাইস'}</div>
                            <div class="detail">🔋 ব্যাটারি: ${data.battery || 'N/A'}%</div>
                            <div class="detail">🌐 ব্রাউজার: ${data.browser || 'N/A'} | 📶 নেটওয়ার্ক: ${data.network || 'N/A'}</div>
                            <div class="detail">📱 স্ক্রিন: ${data.screen || 'N/A'}</div>
                            <div class="detail">📍 অবস্থান: ${data.lat ? parseFloat(data.lat).toFixed(5) : 'N/A'}, ${data.lng ? parseFloat(data.lng).toFixed(5) : ''}</div>
                            <div class="detail" style="font-size:11px; color:#facc15;">🎯 নির্ভুলতা: ${data.accuracy ? Math.round(data.accuracy) + ' মিটার' : 'N/A'}</div>
                            <div class="detail" style="font-size:11px; color:#64748b;">🕒 শেষ আপডেট: ${data.lastSeen ? new Date(data.lastSeen).toLocaleTimeString() : 'N/A'}</div>
                        `;
                        list.appendChild(card);

                        if (data.lat && data.lng) {
                            const pos = [parseFloat(data.lat), parseFloat(data.lng)];
                            const acc = data.accuracy ? parseFloat(data.accuracy) : 50;
                            
                            // মার্কার আপডেট
                            if (markers[id]) {
                                markers[id].setLatLng(pos);
                                if(circles[id]) circles[id].setLatLng(pos).setRadius(acc);
                            } else {
                                const marker = L.marker(pos).addTo(map);
                                marker.bindPopup(`<b>${data.os}</b><br>নির্ভুলতা: ~${Math.round(acc)}m`);
                                markers[id] = marker;
                                
                                // নির্ভুলতার বৃত্ত তৈরি
                                const circle = L.circle(pos, { radius: acc, color: '#38bdf8', fillOpacity: 0.2 }).addTo(map);
                                circles[id] = circle;
                            }
                            map.setView(pos, 16); // লোকেশনে জুম করা
                        }
                    });
                })
                .catch(err => console.error("Error fetching clients:", err));
        }

        // প্রথমবার কল হবে, তারপর প্রতি ১ সেকেন্ডে (১০০০ মিলি সেকেন্ড) রিফ্রেশ হবে
        fetchClients();
        setInterval(fetchClients, 1000);
    </script>
</body>
</html>
